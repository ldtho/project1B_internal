# Project1B internal recording library — separate from the main site.
limit_req_zone $binary_remote_addr zone=project1b_internal_auth:1m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name internal.project1b.space;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 308 https://internal.project1b.space$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name internal.project1b.space;
    ssl_certificate /etc/letsencrypt/live/internal.project1b.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internal.project1b.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/project1b-internal/current;
    index index.html;
    autoindex off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; media-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    client_max_body_size 16k;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
    proxy_buffering off;
    proxy_cache off;

    location = /api/auth/web/login {
        limit_except POST { deny all; }
        limit_req zone=project1b_internal_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8903;
    }
    location = /api/auth/logout {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8903;
    }
    location = /api/auth/me {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8903;
    }
    location = /captioning_data { return 308 /captioning_data/; }
    location ~ ^/captioning_data/(api/(episodes|search|episode|edit|revert)|video|vtt|viewer\.(js|css)|auth\.js)?$ {
        limit_except GET POST { deny all; }
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8326;
        # Viewer uses inline styles for its timeline. Scripts remain external and same-origin.
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; media-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }
    location /captioning_data/ { return 404; }
    location = /api/admin/videos {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8903;
    }
    location ~ ^/api/admin/videos/[1-9][0-9]*(/original-bundle)?$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8903;
    }
    location ~ ^/api/admin/media/[1-9][0-9]*$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8903;
    }
    location /api/ { return 404; }
    location = / {
        limit_except GET { deny all; }
        try_files /index.html =404;
        expires -1;
    }
    location ~ ^/(index\.html|app\.js|styles\.css|favicon\.svg)$ {
        limit_except GET { deny all; }
        try_files $uri =404;
        expires -1;
    }
    location / { return 404; }
}
